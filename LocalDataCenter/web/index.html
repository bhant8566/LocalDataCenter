<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="local-token" content="__LOCAL_TOKEN__">
<title>Local Data Center</title>
<link rel="stylesheet" href="/app.css">
<script defer src="/vendor/pdf-lib.min.js"></script>
<script defer src="/vendor/tesseract.min.js"></script>
<script defer src="/app.js"></script>
</head>
<body>
<header class="mast"><strong>Local Data Center</strong><span>本機工作紀錄</span></header>
<p id="backend-warning" role="alert" hidden></p>
<div class="layout">
  <aside class="left"><div class="panel reserve" aria-label="預留區"></div><div class="panel ip"><small>本機 IPv4</small><div id="ip">—</div></div></aside>
  <main>
    <section class="panel"><div class="bar"><h2>專案</h2><div><button id="rename-project">改名</button><button id="new-project">＋ 新增專案</button></div></div><div id="projects" class="switches"></div></section>
    <section class="panel timeline"><h2>案件時程</h2><div id="timeline"></div></section>
    <section class="panel records">
      <div class="bar"><nav id="sections" class="switches" aria-label="專案分頁"></nav><div><button id="rename-section">改名</button><button id="new-section">＋ 分頁</button></div></div>
      <div class="bar record-heading"><h2>事件紀錄</h2><div class="record-controls"><label class="event-filter">顯示狀態<select id="event-filter"><option value="all">全部</option><option value="active">進行中</option><option value="completed">已結束</option></select></label><button id="new-event" class="primary">＋ 新增事件</button></div></div>
      <div id="events"></div>
    </section>
  </main>
  <aside class="right"><div class="panel tools"><h2>工具</h2><button data-tool="pdf">PDF 切割</button><button data-tool="ocr">OCR 辨識</button></div>
    <section id="calendar" class="panel"><h2>月曆</h2><div class="bar month-nav"><button id="prev-month" aria-label="上個月">‹</button><strong id="month"></strong><button id="next-month" aria-label="下個月">›</button></div><div id="month-grid"></div></section>
  </aside>
</div>
<p id="notice" role="status"></p>
<dialog id="names"><form id="name-form">
<div class="bar"><h2 id="name-title"></h2><button type="button" data-close aria-label="關閉">✕</button></div>
<label>名稱<input id="name-value" required maxlength="80"></label>
<div class="actions"><button class="primary" type="submit">儲存</button></div>
</form></dialog>
<dialog id="edit"><form id="edit-form">
<div class="bar"><h2>事件編輯</h2><button type="button" data-close aria-label="關閉">✕</button></div>
<div class="fields"><label>標題<input id="event-title" required maxlength="200"></label><label>紀錄日期<input id="event-date" type="date" required></label></div>
<section class="schedule-editor"><div class="bar"><h2>時程</h2><button type="button" id="add-schedule">＋ 新增時程</button></div><div id="schedule-rows"></div></section>
<div class="toolbar" aria-label="格式工具">
  <button type="button" data-command="bold"><b>粗體</b></button>
  <select id="font" aria-label="字體大小"><option value="">字體大小</option><option value="2">小</option><option value="3">一般</option><option value="4">中</option><option value="5">大</option><option value="6">特大</option></select>
  <label class="color">文字顏色<input type="color" id="color" value="#19312d"></label>
  <button type="button" id="table">插入表格</button><button type="button" id="add-image">插入圖片</button>
  <button type="button" id="add-file">加入附件</button><button type="button" data-tool="ocr">OCR</button>
</div>
<div id="body" contenteditable="true" role="textbox" aria-label="事件內容" aria-multiline="true"></div>
<input id="image-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
<input id="attach-file" type="file" hidden>
<div id="edit-files"></div>
<div class="actions event-edit-actions"><button id="delete-event" type="button" class="danger-button">移除事件</button><button class="primary" type="submit">儲存事件</button></div>
</form></dialog>
<dialog id="schedule-edit" aria-labelledby="schedule-edit-title"><form id="schedule-form">
<div class="bar"><h2 id="schedule-edit-title">時程編輯</h2><button type="button" data-close aria-label="關閉時程編輯">✕</button></div>
<label>時程名稱<input id="schedule-name" required maxlength="80"></label>
<div class="fields"><label>開始日期<input id="schedule-start" type="date" required></label><label>結束日期<input id="schedule-end" type="date" required></label></div>
<label>文字說明<textarea id="schedule-notes" rows="6" maxlength="500000"></textarea></label>
<div class="schedule-completion-fields"><label>完成日期<input id="schedule-completed-date" type="date"></label><label class="completion-switch"><input id="schedule-completed" type="checkbox" role="switch">已完成</label></div>
<p id="schedule-hint" role="status">請先手動選擇完成日期，再切換為已完成。</p>
<div class="toolbar"><button id="schedule-add-image" type="button">加入圖片</button><button id="schedule-add-file" type="button">加入附件</button></div>
<input id="schedule-image-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden><input id="schedule-attach-file" type="file" hidden>
<div id="schedule-edit-images" class="schedule-images"></div><div id="schedule-edit-files"></div>
<div class="actions"><button type="submit" class="primary">儲存時程</button></div>
</form></dialog>
<dialog id="tool"><div class="bar"><h2 id="tool-title"></h2><button type="button" data-close aria-label="關閉">✕</button></div>
<section id="pdf" hidden>
<label>來源 PDF<input id="pdf-file" type="file" accept=".pdf,application/pdf"></label>
<label>頁碼<input id="pdf-pages" placeholder="例如 2-5,8"></label>
<button id="split" class="primary">抽頁並下載</button>
</section>
<section id="ocr" hidden>
<label>圖片或掃描 PDF<input id="ocr-file" type="file" accept=".pdf,image/*"></label>
<label>辨識結果<textarea id="ocr-result" rows="11" placeholder="辨識後可在此校對"></textarea></label>
<div class="actions"><button id="insert-ocr">插入目前事件</button><button id="recognize" class="primary">開始辨識</button></div>
</section>
<p id="tool-status" role="status"></p>
</dialog>
<dialog id="preview" aria-labelledby="preview-title">
<div class="bar"><h2 id="preview-title">附件預覽</h2><button type="button" data-close aria-label="關閉預覽">✕</button></div>
<p id="preview-status" role="status"></p><div id="preview-content"></div>
<div id="preview-pages" class="bar" hidden><button type="button" id="preview-prev">上一頁</button><span id="preview-page"></span><button type="button" id="preview-next">下一頁</button></div>
<div class="actions"><a id="preview-download" class="download">下載原檔</a></div>
</dialog>
</body>
</html>
